<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#121826"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="rotomGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A1F"/>
      <stop offset="50%" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="lightning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#7000FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .neon-orange { fill: #FF6B00; }
    .neon-blue { fill: #00F0FF; }
    .text-dim { fill: #6B7280; }
    .text-light { fill: #E5E7EB; }
    .text-green { fill: #10B981; }
    .text-gold { fill: #FBBF24; }
  </style>

  <!-- Background Card -->
  <rect x="5" y="5" width="910" height="330" rx="16" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="2"/>

  <!-- Left Side: Rotom Phone / Pokédex Cyber Avatar -->
  <g transform="translate(60, 45)">
    <!-- Aura Glow -->
    <circle cx="100" cy="115" r="95" fill="#FF5A1F" opacity="0.12" filter="url(#glow)"/>
    
    <!-- Rotom Plasma Body Outer -->
    <path d="M100 20 C145 20, 180 65, 180 120 C180 175, 140 215, 100 215 C60 215, 20 175, 20 120 C20 65, 55 20, 100 20 Z" 
          fill="url(#rotomGlow)" filter="url(#glow)"/>

    <!-- Antenna / Lightning Rod -->
    <path d="M100 20 L100 -15 L115 -25 L102 -5 L118 10 Z" fill="#00F0FF" filter="url(#glow)"/>
    
    <!-- Rotom Screen / Inner Face -->
    <ellipse cx="100" cy="120" rx="64" ry="76" fill="#0D1117" stroke="#1F2937" stroke-width="3"/>
    
    <!-- Big Expressive Eyes -->
    <ellipse cx="80" cy="115" rx="12" ry="19" fill="#FFFFFF"/>
    <ellipse cx="80" cy="115" rx="7" ry="13" fill="#00F0FF"/>
    <ellipse cx="82" cy="110" rx="3" ry="5" fill="#FFFFFF"/>

    <ellipse cx="120" cy="115" rx="12" ry="19" fill="#FFFFFF"/>
    <ellipse cx="120" cy="115" rx="7" ry="13" fill="#00F0FF"/>
    <ellipse cx="122" cy="110" rx="3" ry="5" fill="#FFFFFF"/>

    <!-- Cute Zigzag Mouth -->
    <path d="M92 145 Q100 152 108 145" stroke="#FF5A1F" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Electric Hands (Sparks) -->
    <path d="M15 110 L-10 90 L-5 115 L-25 125 L0 135 Z" fill="#00F0FF" filter="url(#glow)"/>
    <path d="M185 110 L210 90 L205 115 L225 125 L200 135 Z" fill="#00F0FF" filter="url(#glow)"/>
    
    <!-- Badge Below Rotom -->
    <rect x="42" y="228" width="116" height="24" rx="12" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <text x="100" y="244" text-anchor="middle" class="mono text-gold" font-size="11" font-weight="bold">ROTOM-DEX v2.0</text>
  </g>

  <!-- Right Side: Terminal Window -->
  <g transform="translate(300, 35)">
    <!-- Terminal Box -->
    <rect x="0" y="0" width="580" height="270" rx="12" fill="#0B0F19" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="580" height="38" rx="12" fill="#131B2E"/>
    <rect x="0" y="28" width="580" height="10" fill="#131B2E"/>
    <line x1="0" y1="38" x2="580" y2="38" stroke="#1E293B" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="20" cy="19" r="6" fill="#EF4444"/>
    <circle cx="40" cy="19" r="6" fill="#F59E0B"/>
    <circle cx="60" cy="19" r="6" fill="#10B981"/>

    <text x="290" y="24" text-anchor="middle" class="mono text-dim" font-size="12">poke-rotom --terminal (mcp + skill)</text>

    <!-- Terminal Content -->
    <!-- Prompt Line -->
    <text x="25" y="70" class="mono text-light" font-size="13">
      <tspan fill="#FF6B00" font-weight="bold">rotom</tspan> <tspan fill="#3B82F6">query</tspan> charizard <tspan fill="#6B7280">--sprite official --weakness</tspan>
    </text>

    <!-- Output 1: Multi-language & Species -->
    <text x="25" y="100" class="mono" font-size="12.5">
      <tspan fill="#10B981">✔</tspan> <tspan fill="#F3F4F6" font-weight="bold">[#006 Charizard]</tspan> <tspan fill="#9CA3AF">噴火龍 · リザードン</tspan>
      <tspan fill="#EF4444" font-weight="bold"> [Fire / Flying]</tspan>
    </text>

    <!-- Output 2: Stats (BST) -->
    <text x="25" y="128" class="mono text-light" font-size="12">
      <tspan fill="#8B5CF6">📊 Base Stats (BST):</tspan> <tspan fill="#FBBF24" font-weight="bold">534</tspan> <tspan fill="#6B7280">(HP:78 Atk:84 Def:78 SpA:109 SpD:85 Spe:100)</tspan>
    </text>

    <!-- Output 3: Battle Weakness Analysis -->
    <text x="25" y="156" class="mono text-light" font-size="12">
      <tspan fill="#EC4899">🛡️ Battle Weaknesses:</tspan> <tspan fill="#F87171" font-weight="bold">Rock (4x) · Water (2x) · Electric (2x)</tspan>
    </text>

    <!-- Output 4: Sprite Download -->
    <text x="25" y="184" class="mono text-light" font-size="12">
      <tspan fill="#00F0FF">🎨 Official HD Sprite:</tspan> <tspan fill="#E5E7EB">charizard_official.png</tspan> <tspan fill="#10B981">(475x475 HD)</tspan>
    </text>

    <!-- Divider Line -->
    <line x1="25" y1="206" x2="555" y2="206" stroke="#1E293B" stroke-width="1" stroke-dasharray="4"/>

    <!-- Token Diet Highlight -->
    <text x="25" y="235" class="mono" font-size="13">
      <tspan fill="#FBBF24" font-weight="bold">⚡ Token Diet (-99.6%):</tspan> 
      <tspan fill="#10B981" font-weight="bold"> 150 B</tspan> 
      <tspan fill="#6B7280">vs</tspan> 
      <tspan fill="#EF4444" text-decoration="line-through"> 200 KB Raw PokéAPI JSON</tspan>
      <tspan fill="#00F0FF"> [Offline 5ms]</tspan>
    </text>
  </g>
</svg>